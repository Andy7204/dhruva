# Dhruva — local runner. The public app runs on Streamlit Cloud; this is the
# "run it on my own machine" option.
#
#   View the app       ->  docker compose up dhruva      then open http://localhost:8501
#   Daily update       ->  docker compose run --rm update
#   Stop               ->  docker compose down
services:
  dhruva:
    build: .
    image: dhruva:latest
    ports:
      - "8501:8501"
    volumes:
      - ./runs:/app/runs
      - ./data/indices:/app/data/indices
    restart: unless-stopped

  update:
    build: .
    image: dhruva:latest
    command: python -m dhruva.daily
    volumes:
      - ./runs:/app/runs
      - ./data/indices:/app/data/indices
