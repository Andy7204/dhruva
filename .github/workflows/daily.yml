name: Daily paper-trading update

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-paper-book
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        id: dependencies
        run: python -m pip install --retries 3 --timeout 30 -r requirements.lock
      - name: Verify frozen strategy and reliability tests
        id: tests
        run: |
          python -m dhruva.freeze
          python -m unittest discover -s tests -v
      - name: Advance paper books and rebuild dashboard
        id: pipeline
        run: python -m dhruva.run_daily
      - name: Record job outcome even after failure
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python -m dhruva.operations
      - name: Commit refreshed data and dashboard
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs/ reports/dashboard.html data/cache/
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Refresh daily paper books and dashboard'
            for attempt in 1 2 3; do
              git push && exit 0
              sleep 5
            done
            echo 'Publication failed. Evidence remains in uploaded artifact; do not force-push.'
            exit 1
          fi
      - name: Preserve operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-evidence-${{ github.run_id }}
          path: runs/operations/
          retention-days: 30
          if-no-files-found: warn
