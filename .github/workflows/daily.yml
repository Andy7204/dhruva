name: Daily paper-trading update

on:
  schedule:
    - cron: '0 13 * * 1-5'
    # Weekend special sessions only; ordinary weekends exit through the guard.
    - cron: '0 18 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-paper-book
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        id: dependencies
        run: python -m pip install --retries 3 --timeout 30 -r requirements.lock
      - name: Reliability tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Update market data and paper books
        id: pipeline
        run: python -m dhruva.daily
      - name: Restore scanner cache (prices, fundamentals, filings)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/scanner_cache
          key: scanner-${{ github.run_id }}
          restore-keys: scanner-
      - name: Inflection funnel (Stages 1-3)
        id: inflection
        continue-on-error: true
        timeout-minutes: 30
        run: python -m scanner.daily
      - name: Commit refreshed data and dashboard
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m dhruva.publication
      - name: Post paper call update (change or Friday summary only)
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m dhruva.digest
      - name: Preserve operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-evidence-${{ github.run_id }}
          path: |
            runs/
            data/indices/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish or resolve external pipeline incident
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
        run: python -m dhruva.alerts --pipeline
