name: Independent daily watchdog
on:
  schedule:
    - cron: '0 21 * * *' #02:30 IST, after the previous daily deadline
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Create, deduplicate and resolve a clearly labelled test alert'
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: daily-watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --retries 3 --timeout 30 -r requirements.lock
      - name: Check operational evidence
        id: watchdog
        if: ${{ inputs.test_alert != true }}
        run: python -m dhruva.watchdog
      - name: Publish or resolve operational incident
        if: ${{ always() && inputs.test_alert != true }}
        env:
          WATCHDOG_OUTCOME: ${{ steps.watchdog.outcome }}
        run: python -m dhruva.alerts
      - name: Verify external test alert lifecycle
        if: ${{ inputs.test_alert == true }}
        run: python -m dhruva.watchdog --test-alert
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: watchdog-${{ github.run_id }}
          path: runs/watchdog/
          retention-days: 30
